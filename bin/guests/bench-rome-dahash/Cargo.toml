[workspace.package]

[package]
name = "bench-rome-dahash"
description = "Measures guest-rome's DA-hash stage (da::commitment) alone, software keccak vs the ZisK-accelerated path — build twice (default = accelerated, --features guest-rome/bench-software-keccak = software) and diff ziskemu's step counts. Not the production guest."
version = "0.1.0"
edition = "2021"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[dependencies]
guest-rome = { path = "../../../crates/clients/rome/guest" }
ziskos = "1.3.1-alpha"
serde = { version = "1", features = ["derive"] }
bincode = { version = "2.0", default-features = false, features = ["serde", "std"] }

# Pinned exactly like this ELF's stateless-validator-rome sibling: this is its OWN standalone workspace
# (own Cargo.lock), so nothing else here constrains guest-rome's transitive alloy-* deps down to the
# toolchain-compatible versions — an unpinned resolve here picked alloy-consensus 2.4.2, which needs a
# newer rustc than this box's ZisK toolchain ships (found while building this harness).
alloy-consensus = { version = "=2.0.5", default-features = false }
alloy-primitives = { version = "=1.6.0", features = ["native-keccak"] }
alloy-genesis = "=2.0.5"
alloy-rpc-types-debug = "=2.0.5"
alloy-eips = { version = "=2.0.5", default-features = false }
alloy-serde = "=2.0.5"
alloy-tx-macros = "=2.0.5"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(zisk_hints)'] }
